<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auction Spread Finder</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Auction Spread Finder</h1>
      <span class="sub" id="locationLabel"></span>
    </div>
    <div class="actions">
      <span class="lastrun" id="lastRun"></span>
      <button id="settingsBtn" class="btn">Settings</button>
      <button id="refreshBtn" class="btn primary">Refresh</button>
    </div>
  </header>

  <section id="settings" class="settings" hidden>
    <h2>Settings</h2>
    <p class="settings-intro">
      Everything the app needs. Changes save to this computer only.
    </p>

    <label class="field">
      <span class="field-label">AuctionNinja pages to watch</span>
      <span class="field-help">
        Search AuctionNinja in your browser however you like, then copy the address
        bar and paste it here. One per line.
      </span>
      <textarea id="setSources" rows="3" spellcheck="false"
        placeholder="https://www.auctionninja.com/..."></textarea>
    </label>

    <label class="field">
      <span class="field-label">Where price comparisons come from</span>
      <span class="field-help">
        Sold prices are what buyers actually paid. eBay's free API returns asking
        prices, which run high on antiques, so those get discounted before use.
      </span>
      <select id="setCompSource">
        <option value="auto">Best of both — sold prices, falling back to eBay API (recommended)</option>
        <option value="ebay-api">eBay API only — free, but asking prices</option>
        <option value="apify">Apify only — real sold prices, costs per lookup</option>
      </select>
    </label>

    <fieldset class="subpanel" id="compApifyPanel">
      <legend><span class="legend-text">Apify comp settings</span></legend>
      <div class="field-row">
        <label class="field">
          <span class="field-label">eBay Actor</span>
          <span class="field-help">From the Apify Store — search "eBay".</span>
          <input type="text" id="setCompActor" spellcheck="false" placeholder="username~ebay-scraper">
        </label>
        <label class="field narrow">
          <span class="field-label">Sold listings?</span>
          <span class="field-help">Tick if the Actor returns sold prices.</span>
          <label class="toggle"><input type="checkbox" id="setCompSold"><span>Sold data</span></label>
        </label>
      </div>
      <label class="field">
        <span class="field-label">Actor input (JSON)</span>
        <span class="field-help"><code>{{query}}</code> is replaced with each item's search term.</span>
        <textarea id="setCompInput" rows="3" spellcheck="false"></textarea>
      </label>
    </fieldset>

    <div class="field-row" id="ebayKeysRow">
      <label class="field">
        <span class="field-label">eBay App ID <em id="ebayState"></em></span>
        <span class="field-help">Free from developer.ebay.com — needed to price items.</span>
        <input type="text" id="setEbayId" spellcheck="false" autocomplete="off">
      </label>
      <label class="field">
        <span class="field-label">eBay Cert ID (secret)</span>
        <span class="field-help">Leave blank to keep what's already saved.</span>
        <input type="password" id="setEbaySecret" autocomplete="off">
      </label>
    </div>

    <fieldset class="subpanel">
      <legend>
        <label class="toggle">
          <input type="checkbox" id="setApifyEnabled">
          <span>Use Apify to fetch listings</span>
        </label>
      </legend>
      <p class="field-help">
        Recommended. Apify runs a maintained AuctionNinja scraper on their own
        servers, so this app never has to read the site itself.
      </p>

      <div class="field-row">
        <label class="field">
          <span class="field-label">Apify API token <em id="apifyState"></em></span>
          <span class="field-help">Apify Console → Settings → Integrations.</span>
          <input type="password" id="setApifyToken" autocomplete="off">
        </label>
        <label class="field">
          <span class="field-label">Actor</span>
          <span class="field-help">Copy from the Actor's page URL.</span>
          <input type="text" id="setApifyActor" spellcheck="false">
        </label>
      </div>

      <label class="field">
        <span class="field-label">When to fetch</span>
        <span class="field-help">
          "Read last run" is cheaper and faster — schedule the Actor inside Apify
          and this just reads the results.
        </span>
        <select id="setApifyMode">
          <option value="last">Read the last completed Apify run</option>
          <option value="run">Run the Actor now, each time I refresh</option>
        </select>
      </label>

      <label class="field" id="apifyInputField">
        <span class="field-label">Actor input (JSON)</span>
        <span class="field-help">
          Only used when running the Actor. Copy this from the Actor's Input tab
          in Apify Console so it matches exactly.
        </span>
        <textarea id="setApifyInput" rows="4" spellcheck="false"></textarea>
      </label>
    </fieldset>

    <div class="field-row">
      <label class="field narrow">
        <span class="field-label">Buyer's premium</span>
        <span class="field-help">Check the sale — usually 15–18%.</span>
        <div class="inline"><input type="number" id="setPremium" step="1" min="0" max="50"><span class="suffix">%</span></div>
      </label>
      <label class="field narrow">
        <span class="field-label">Sales tax</span>
        <span class="field-help">CT is 6.35%.</span>
        <div class="inline"><input type="number" id="setTax" step="0.05" min="0" max="20"><span class="suffix">%</span></div>
      </label>
      <label class="field narrow">
        <span class="field-label">Shipping per item</span>
        <span class="field-help">What you expect to eat.</span>
        <div class="inline"><span class="prefix">$</span><input type="number" id="setShip" step="1" min="0"></div>
      </label>
    </div>

    <div class="settings-actions">
      <button id="saveSettings" class="btn primary">Save settings</button>
      <button id="closeSettings" class="btn">Close</button>
      <span id="saveMsg" class="save-msg"></span>
    </div>
  </section>

  <div id="banner" class="banner" hidden></div>

  <section class="controls">
    <label class="ctl">
      <span>Min net spread</span>
      <div class="inline">
        <span class="prefix">$</span>
        <input type="number" id="minSpread" value="250" step="25" min="0">
      </div>
    </label>
    <label class="ctl">
      <span>Min confidence <em id="confVal">45%</em></span>
      <input type="range" id="minConfidence" min="0" max="100" value="45">
    </label>
    <div class="stats" id="stats"></div>
  </section>

  <main id="results"></main>

  <div id="progress" class="progress" hidden>
    <div class="progress-inner">
      <div class="spinner"></div>
      <div>
        <strong>Refreshing…</strong>
        <pre id="progressLog"></pre>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
